<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
  <defs>
    <style>
      .title { font: 700 20px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111; }
      .sub   { font: 500 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #333; }
      .node  { fill: #8E51FF; stroke: #111; stroke-width: 2; }
      .nodeText { font: 700 14px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .link  { stroke: #111; stroke-width: 2.2; fill: none; }
      .box   { fill: #fff; stroke: #111; stroke-width: 2; }
      .label { font: 600 12px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #111; }
      .small { font: 500 12px system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #333; }
      .accent { stroke: #111; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .ringHint { stroke: #111; stroke-width: 1.5; fill: none; stroke-dasharray: 6 6; opacity: 0.25; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white"/>
  <!-- Client Box -->
  <rect class="box" x="40" y="180" width="230" height="150" rx="14"/>
  <text x="60" y="208" class="label">Clients (C0–C4)</text>
  <text x="60" y="234" class="small">• One server per operation</text>
  <text x="60" y="256" class="small">• Write → primary H(Ok)</text>
  <text x="60" y="278" class="small">• Read → any replica</text>
  <text x="60" y="300" class="small">• Retry on failure</text>

  <!-- ===================== -->
  <!-- Equidistant Ring      -->
  <!-- ===================== -->
  <!-- Center (640, 360), radius ~170 -->
  <circle class="ringHint" cx="640" cy="360" r="170"/>

  <!-- Precomputed uniform points on circle for 7 nodes (angle step = 360/7) -->
  <!-- S0 at -90° (top), clockwise -->
  <!-- R=170, cx=640, cy=360 -->
  <!-- S0: (640,190) -->
  <!-- S1: (773,254) -->
  <!-- S2: (806,402) -->
  <!-- S3: (715,513) -->
  <!-- S4: (565,513) -->
  <!-- S5: (474,402) -->
  <!-- S6: (507,254) -->

  <!-- Ring edges (7 total) -->
  <path class="link" d="M 640 190 L 773 254" />  <!-- S0→S1 -->
  <path class="link" d="M 773 254 L 806 402" />  <!-- S1→S2 -->
  <path class="link" d="M 806 402 L 715 513" />  <!-- S2→S3 -->
  <path class="link" d="M 715 513 L 565 513" />  <!-- S3→S4 -->
  <path class="link" d="M 565 513 L 474 402" />  <!-- S4→S5 -->
  <path class="link" d="M 474 402 L 507 254" />  <!-- S5→S6 -->
  <path class="link" d="M 507 254 L 640 190" />  <!-- S6→S0 -->

  <!-- Server nodes -->
  <circle class="node" cx="640" cy="190" r="26"/><text class="nodeText" x="640" y="190">S0</text>
  <circle class="node" cx="773" cy="254" r="26"/><text class="nodeText" x="773" y="254">S1</text>
  <circle class="node" cx="806" cy="402" r="26"/><text class="nodeText" x="806" y="402">S2</text>
  <circle class="node" cx="715" cy="513" r="26"/><text class="nodeText" x="715" y="513">S3</text>
  <circle class="node" cx="565" cy="513" r="26"/><text class="nodeText" x="565" y="513">S4</text>
  <circle class="node" cx="474" cy="402" r="26"/><text class="nodeText" x="474" y="402">S5</text>
  <circle class="node" cx="507" cy="254" r="26"/><text class="nodeText" x="507" y="254">S6</text>

  <!-- Highlight replica example: H(Ok)=S2 → replicas S2,S3,S4 -->
  <circle cx="806" cy="402" r="38" fill="none" stroke="#3900A3" stroke-width="2.2"/>
  <circle cx="715" cy="513" r="38" fill="none" stroke="#3900A3" stroke-width="2.2"/>
  <circle cx="565" cy="513" r="38" fill="none" stroke="#3900A3" stroke-width="2.2"/>

  <!-- Example client → primary write arrow -->
  <path class="accent" d="M 270 265 C 370 250, 470 280, 770 390" />
  <text x="300" y="255" class="small">example write</text>
</svg>
